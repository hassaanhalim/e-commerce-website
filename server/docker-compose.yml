services:
  postgres:
    image: postgres:16-alpine
    container_name: shoe-store-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shoe_store
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: